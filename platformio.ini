; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-eye]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
build_src_filter = +<*> -<PinCheckMain.cpp>

; The ESP32-S3-EYE's WROOM-1 module uses octal PSRAM. The generic
; esp32-s3-devkitm-1 board definition doesn't set this correctly on its
; own — without it, camera frame buffer allocation in PSRAM silently
; fails ("frame buffer malloc failed"). [UNCONFIRMED until a pin-check
; camera capture succeeds — see include/pins_config.h.]
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

; Native-USB (USB-Serial-JTAG) board: if the serial monitor asserts DTR/RTS
; on open, the ROM interprets it as a reset-into-bootloader request — the
; board then sits dark in download mode until RST is pressed, which looks
; like "the screen only works while I hold RST". Keep both lines deasserted.
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_ESP32S3_EYE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The AI engines send TTS audio as base64 PCM inside JSON WebSocket
    ; messages that can exceed the library's 15 KB default frame limit.
    -DWEBSOCKETS_MAX_DATA_SIZE=65536

lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    thomasfredericks/Bounce2 @ ^2.71
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3

; Standalone diagnostic firmware — tests each pin in pins_config.h in
; isolation with an obvious expected output (LED colors, LCD text, button
; press, mic level, speaker tone, camera capture). Reuses the same driver
; modules as the main firmware, just swaps main.cpp for PinCheckMain.cpp.
[env:esp32-s3-eye-pincheck]
extends = env:esp32-s3-eye
build_src_filter = +<*> -<main.cpp>
